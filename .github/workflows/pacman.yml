name: Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/pacman.yml]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Generate the Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # The built-in token can't see private contribution counts, so the
          # graph would only show public activity. PACMAN_TOKEN is a classic
          # PAT with only the read:user scope.
          github_token: ${{ secrets.PACMAN_TOKEN || github.token }}
          games: pacman

      - name: Push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
